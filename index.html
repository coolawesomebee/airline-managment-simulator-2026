<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Management Simulator 2026</title>
    <style>
        body {
            background-color: #0b132b;
            color: #f0f3f4;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            width: 90vw;
            max-width: 800px;
            background-color: #1c2541;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid #3a506b;
        }

        h1 {
            color: #ffd166;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 20px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.6;
            font-size: clamp(1rem, 1.5vw, 1.2rem);
            margin-bottom: 35px;
        }

        .launch-btn {
            display: inline-block;
            font-family: inherit;
            background-color: #ffd166;
            color: #0b132b;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 209, 102, 0.3);
            transition: all 0.2s ease;
        }

        .launch-btn:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        .launch-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✈️ AIRLINE MANAGEMENT SIMULATOR</h1>
        <p>
            Take command of the skies. Build your global flight network, optimize 
            fleet logistics, and manage financial operations in a deep, strategic 
            airline simulation.
        </p>
        <button id="launch-btn" class="launch-btn">🛫 Launch Dispatch Desk</button>
    </div>

    <script>
        document.getElementById("launch-btn").onclick = function() {
            alert("System operational! Landing page button connection is successful.");
        };
    </script>

</body>
</html>
