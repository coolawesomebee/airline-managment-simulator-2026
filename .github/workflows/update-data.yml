name: Automated Airport Data Filter

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# FIX 1: Grant explicit write permissions so the automated runner can save airports.json
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python environment
      uses: actions/setup-python@v5
      with:
        # FIX 2: Corrected setup parameter name
        python-version: '3.10'

    # FIX 3: Optional but highly recommended: auto-install urllib if any environment dependencies drift
    run: python filter_airports.py

    - name: Commit and push updated airports.json file
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add airports.json
        git diff-index --quiet HEAD || git commit -m "Automated daily airport data sync"
        git push
